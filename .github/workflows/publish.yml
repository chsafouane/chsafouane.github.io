name: Publish site

# Every push and pull request builds the site; only master deploys it.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Check post conventions
        run: python3 tools/check_posts.py

      # Figures and charts are drawn by posts/*/figures.py and the syntax
      # themes come from _brand.yml; fail if the committed SVGs, manifests,
      # chart specs or themes are not what the code produces.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (no moving major tag)

      - name: Check figures, charts and syntax themes are up to date
        run: |
          uv sync --locked --all-extras
          uv run figkit build --no-raster
          uv run figkit syntax --check
          changes="$(git status --porcelain -- 'posts/*/assets/figures' 'posts/*/assets/charts')"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::Figures or charts are out of date: run 'uv run figkit build' and commit the result."
            exit 1
          fi

      # Notebooks are rendered from their stored outputs, so no Python or
      # Jupyter is needed here.
      - name: Render site
        run: quarto render

      # Medium import page and Substack copy page of every post, in _site/crosspost
      - name: Build cross-post pages
        run: uv run blog crosspost --no-render

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
