[project]
name = "chsafouane-blog-tools"
version = "0.1.0"
description = "Figure kit (figkit) and helper tools for chsafouane.github.io"
requires-python = ">=3.12"
dependencies = [
    "fonttools[woff]>=4.55",
    "uharfbuzz>=0.45",
    "pyyaml>=6.0",
    "pillow>=11.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.9", "numpy>=2.0"]

[project.scripts]
figkit = "figkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/figkit"]
