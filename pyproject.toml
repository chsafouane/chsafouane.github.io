[project]
name = "chsafouane-blog-tools"
version = "0.1.0"
description = "Writing tools for chsafouane.github.io: the figure kit (figkit) and the blog workflow"
requires-python = ">=3.12"
dependencies = [
    "fonttools[woff]>=4.55",
    "uharfbuzz>=0.45",
    "pyyaml>=6.0",
    "pillow>=11.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.9", "numpy>=2.0"]

[project.scripts]
figkit = "figkit.cli:main"
blog = "blog.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/figkit", "tools/blog"]
