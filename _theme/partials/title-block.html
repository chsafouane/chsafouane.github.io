<header id="title-block-header" class="quarto-title-block default">
<div class="quarto-title">
$if(categories)$
<p class="eyebrow">$for(categories)$$categories$$sep$ · $endfor$</p>
$endif$
$if(title)$
<h1 class="title">$title$</h1>
$endif$
$if(subtitle)$
<p class="subtitle lead">$subtitle$</p>
$endif$
$if(hide-description)$
$elseif(description)$
<div class="description lead">
$description$
</div>
$endif$
</div>

$title-metadata.html()$

</header>
