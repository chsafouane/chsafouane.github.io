$if(date)$
<div class="ch-meta">
$if(by-author)$
<span class="meta-author">$for(by-author)$$it.name.literal$$sep$, $endfor$</span>
$endif$
<span><time class="date">$date$</time></span>
$if(date-modified)$
<span>Updated <time class="date-modified">$date-modified$</time></span>
$endif$
$if(reading-time)$
<span class="meta-time">$reading-time$</span>
$endif$
</div>
$endif$
