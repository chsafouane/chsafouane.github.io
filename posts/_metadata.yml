# Options that apply to every post in this folder.

# Posts are notebooks rendered from their stored outputs; never execute them
# (CI has no Python or Jupyter).
execute:
  enabled: false
freeze: true

date-format: "MMM D, YYYY"

toc: true
toc-depth: 3
toc-location: right
toc-title: "Contents"

reference-location: margin
lightbox: auto
